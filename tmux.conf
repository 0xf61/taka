set -g window-status-current-style "fg=orange bold"
set -g status-style "bg=default"
set -g status-right ""
set -g status-position top
set -g status-left "#S"
set -g status-justify absolute-centre
set -g renumber-windows on
set -g prefix C-SPACE
set -g mode-keys vi
set -g base-index 1
set -a terminal-features "tmux-256color:RGB"
bind b set -g status
if-shell 'test -x /opt/homebrew/bin/fish' 'set -g default-shell /opt/homebrew/bin/fish' 'set -g default-shell /usr/bin/fish'
