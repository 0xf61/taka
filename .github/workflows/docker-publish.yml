name: Build and Push Docker Images

on:
  workflow_dispatch:
  schedule:
    - cron: 37 13 * * 0
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Only the latest commit gets built; outdated runs are cancelled
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - name: alpine
            file: alpine.Dockerfile
          - name: arch
            file: arch.Dockerfile
          - name: kali
            file: kali.Dockerfile
          - name: pwnbox
            file: pwnbox.Dockerfile
            # pwnbox layers (~6.5GB) blow past the 10GB GHA cache repo limit and
            # the weekly kali-bleeding-edge base bump invalidates them anyway
            cache: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: ${{ matrix.dockerfile.cache && format('type=gha,scope=buildx-{0}', matrix.dockerfile.name) || 'type=gha,disabled=true' }}
          cache-to: ${{ matrix.dockerfile.cache && format('type=gha,mode=max,scope=buildx-{0}', matrix.dockerfile.name) || 'type=gha,disabled=true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.dockerfile.name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.dockerfile.name }}-${{ github.sha }}
